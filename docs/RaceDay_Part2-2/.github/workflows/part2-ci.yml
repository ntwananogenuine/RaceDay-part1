name: Part 2 CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore part2/RaceDay.sln

      - name: Build
        run: dotnet build part2/RaceDay.sln --no-restore -c Release

      - name: Test
        run: dotnet test part2/RaceDay.sln --no-build -c Release --verbosity normal
